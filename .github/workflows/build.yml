name: GitHub Actions Build Test
permissions:
  contents: read
on:
  push:
    branches:
        - master
  pull_request:
    branches:
        - master
jobs:
  cppcheck-test:
    runs-on: ubuntu-latest
    steps:
    - run: echo "This job was triggered by a ${{ github.event_name }} event."
    - name: Checkout Repo
      uses: actions/checkout@v5
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y cppcheck && \
        cppcheck . --force --inline-suppr
  build-test-ubuntu-ish:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y build-essential libssl-dev libsctp-dev
    - name: build
      run: |
        ./configure && make && make check
    - name: build iperf-tunnel
      run: |
        make -C src/tunnel
        ./iperf-tunnel --help
    - name: test commands
      run: |
        timeout 300 src/iperf3 -s &
        ./test_commands.sh localhost
    - name: test auth
      run: |
        pkill iperf3
        ./auth_test.sh
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: build for android (termux, aarch64)
      run: ./ci/build-android.sh
  build-test-sanitizer-address:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Running address sanitzer"
    - name: Checkout Repo
      uses: actions/checkout@v5
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y build-essential libssl-dev libsctp-dev
    - name: build
      run: |
        ./configure CFLAGS="-g -O0 -fsanitize=address" LDFLAGS="-fsanitize=address" && make && make check
    - name: build iperf-tunnel
      run: |
        make -C src/tunnel LDFLAGS="-fsanitize=address,undefined"
        ./iperf-tunnel --help
    - name: test commands
      run: |
        timeout 300 src/iperf3 -s &
        ./test_commands.sh localhost
    - name: test auth
      run: |
        pkill iperf3
        ./auth_test.sh
